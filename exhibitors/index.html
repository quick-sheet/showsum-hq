* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  min-height: 100vh;
}
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 34rem; margin: 0 auto; padding: 0 20px 48px; position: relative; }

/* Header: stays put while the page scrolls */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); transition: box-shadow .2s; }
@supports (backdrop-filter: blur(1px)) and (background: color-mix(in srgb, red, blue)) {
  .top { background: color-mix(in srgb, var(--bg) 94%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
}
.top.scrolled { box-shadow: 0 1px 0 var(--line-2); }
.top::before { content: ""; display: block; height: env(safe-area-inset-top); background: var(--status); }
.top-in { max-width: 34rem; margin: 0 auto; padding: 0 20px 6px; }
header { display: grid; grid-template-columns: 1fr auto; align-items: start; padding: 18px 0 6px; }
.brand { display: flex; align-items: flex-start; gap: 2px; min-width: 0; }
.back { margin: -10px 0 0 -12px; flex: none; }
.mark { font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.where { display: flex; font-size: 13px; color: var(--ink-3); margin-top: 1px; white-space: nowrap; min-width: 0; }
.where .wl { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.where .wn { flex: none; }
.where .dot { margin: 0 6px; }
.where:empty { display: none; }
.tools { display: flex; gap: 4px; margin: -10px -8px 0 0; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.icon-btn:active { background: var(--raise); }
.icon-btn svg { width: 22px; height: 22px; }

/* Notices */
.notice { display: flex; gap: 12px; align-items: center; margin: 10px 0 0; padding: 10px 12px 10px 14px; border-radius: 14px; background: var(--raise); border: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
.notice p { margin: 0; flex: 1; }
.notice .link-btn { color: var(--sun); font-weight: 600; white-space: nowrap; text-decoration: none; }
.notice .x { color: var(--ink-3); width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; }
.notice .x svg { width: 16px; height: 16px; }

/* Hero */
.hero { padding: 8px 0 22px; }
/* The two bars at the top of each screen: "Can you email them?" and "Who runs their email?" */
.lgroup { margin-top: 20px; max-width: 30em; }
.lgroup-h { margin: 0 0 9px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); letter-spacing: .01em; }
.lbar { display: flex; gap: 3px; height: 14px; border-radius: 7px; overflow: hidden; }
.lbar .seg { flex: 1 1 0; min-width: 4px; display: flex; align-items: center; }
.lbar.email { height: 22px; border-radius: 6px; }
.lbar.email .seg { padding-left: 5px; }
.lbar .seg .logo { width: 13px; height: 13px; }
.seg.corporate { background: var(--st-ok); }
.seg.check { background: var(--st-check); }
.seg.consent { background: var(--st-consent); }
.seg.google { background: var(--prov-g); }
.seg.microsoft { background: var(--prov-m); }
.seg.other { background: var(--prov-o); }
.seg.pending { background: repeating-linear-gradient(135deg, var(--line-2) 0 2px, transparent 2px 6px); box-shadow: inset 0 0 0 1px var(--line-2); }
.lgroup .leads { margin-top: 8px; }
.bars-empty { display: grid; gap: 12px; width: min(100%, 300px); margin: 8px auto 22px; }
.bars-empty .lbar .seg { flex-grow: 1; }
:root { --prov-g: var(--raise-2); --prov-m: var(--raise-2); --prov-o: var(--raise); }
@supports (background: color-mix(in srgb, red, blue)) {
  :root { --prov-g: color-mix(in srgb, var(--ink) 24%, var(--raise)); --prov-m: color-mix(in srgb, var(--ink) 15%, var(--raise)); --prov-o: color-mix(in srgb, var(--ink) 7%, var(--raise)); }
}
/* Google and Microsoft tiles */
.logo { width: 16px; height: 16px; display: inline-block; vertical-align: -3px; flex: none; }
.chip .logo { width: 15px; height: 15px; margin-right: 6px; vertical-align: -2px; }
.ex-sub .logo, .tag .logo { width: 13px; height: 13px; margin-right: 4px; vertical-align: -2px; }
.kv .v .logo { margin-right: 6px; }
/* Waiting on Apps Script: a spinner in the button or in the message at the bottom */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 9px; flex: none; }
.btn.busy::after, .menu button.busy::after, .chip.busy::after { content: ''; display: inline-block; width: 13px; height: 13px; margin-left: 8px; vertical-align: -2px; }
/* The comet: a ring in the text colour whose tail fades away behind its head, turning steadily */
.spinner, .btn.busy::after, .menu button.busy::after, .chip.busy::after {
  border-radius: 50%; background: conic-gradient(from 90deg, transparent 10%, currentColor 95%);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.2px), #000 calc(100% - 2px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 2.2px), #000 calc(100% - 2px));
  animation: spin .8s linear infinite;
}
.menu button { position: relative; }
.menu button.busy::after { position: absolute; right: 4px; top: 50%; margin: -7px 0 0; }
.title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.title-row > :first-child { flex: 1; min-width: 0; }
.row-icons { display: flex; flex: none; margin: -9px -10px 0 0; }
.ico-btn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink-2); transition: opacity .12s; }
.ico-btn.main { color: var(--sun); }
.ico-btn:active { opacity: .45; }
.ico-btn svg { width: 24px; height: 24px; }
.sat-name { margin: 0; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -.015em; overflow-wrap: anywhere; }
.when { margin: 4px 0 0; font-size: 15px; color: var(--ink-2); }
.story { margin: 14px 0 0; font-size: 18px; font-weight: var(--thin); line-height: 1.55; letter-spacing: .005em; color: var(--ink); max-width: 30em; }
.facts { margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
.empty-title { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.empty-body { margin: 8px 0 0; color: var(--ink-2); max-width: 28em; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.btn { height: 44px; padding: 0 18px; border-radius: 22px; background: var(--raise-2); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.btn.primary { background: var(--sun); color: var(--on-sun); }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }
.link-btn { color: var(--ink-2); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.bar { height: 6px; border-radius: 3px; background: var(--raise-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sun); border-radius: 3px; transition: width .4s ease; }

/* Forms */
.field { width: 100%; min-width: 0; height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--bg); padding: 0 12px; font-size: 16px; }
textarea.field { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; line-height: 1.4; }
.field::placeholder { color: var(--ink-3); }
.lbl { display: block; margin: 16px 0 6px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.hint { margin: 6px 0 0; font-size: 13px; color: var(--ink-3); }
/* Link | List on the add form */
.lbl-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 16px 0 2px; }
.lbl-row .lbl { margin: 0; }
.mode { display: inline-flex; padding: 3px; border-radius: 20px; background: var(--raise-2); flex: none; }
.mode button { min-height: 34px; min-width: 64px; padding: 0 14px; border-radius: 17px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.mode button[aria-checked="true"] { background: var(--ink); color: var(--bg); }
.sheet .mode-note { color: var(--ink-2); }
.field-row { display: flex; gap: 8px; margin-top: 10px; }
.field-row .field { flex: 1; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.search-form { margin: 18px 0 0; }
.search-form .field-row { margin-top: 0; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 18px; background: var(--raise-2); font-size: 14px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
/* Status pills: same colours as the stand plan. Soft tint and ring when off, solid when selected. */
.chip.st { --stc: var(--st-ok); --onc: var(--on-ok); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--stc); }
.chip.st-check { --stc: var(--st-check); --onc: var(--on-check); }
.chip.st-consent { --stc: var(--st-consent); --onc: var(--on-consent); }
@supports (background: color-mix(in srgb, red, blue)) {
  .chip.st { background: color-mix(in srgb, var(--stc) 13%, var(--raise-2)); }
}
.chip.st[aria-pressed="true"] { background: var(--stc); color: var(--onc); box-shadow: none; }
.chip .n { font-size: 12.5px; opacity: .8; }
.filters { margin: 4px 0 0; }
.quiet-search { margin: 12px 0 0; }

/* Lists */
.day { margin: 26px 0 2px; font-size: 14px; font-weight: 500; color: var(--ink-3); }
.section-title { margin: 32px 0 2px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.section-note { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-3); }
/* Find exhibitions: listings you browse yourself, the Google searches, and how a show gets from there into the app */
.finder { margin-top: 30px; }
.finder-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.finder-head .section-title { margin: 0; }
.finder-head .ico-btn { margin-right: -10px; }
.how { list-style: none; margin: 10px 0 0; padding: 14px 10px 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; border-radius: 18px;
  background: linear-gradient(180deg, var(--raise), var(--bg)); border: 1px solid var(--line); counter-reset: how; }
.how li { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 7px; font-size: 12.5px; line-height: 1.3; color: var(--ink-2); }
.how li + li::before { content: ''; position: absolute; top: 17px; left: calc(-50% + 22px); width: calc(100% - 44px); border-top: 1px dashed var(--line-2); }
.how .hi { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--sun-soft); color: var(--sun); }
.how .hi svg { width: 19px; height: 19px; }
.finder-sub { margin: 20px 2px 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; justify-content: space-between; }
.finder-sub span { font-weight: 400; color: var(--ink-3); }
.src-group { border-radius: 18px; background: var(--raise); border: 1px solid var(--line); overflow: hidden; }
.src { display: flex; align-items: center; }
.src + .src { border-top: 1px solid var(--line); }
.src-main { flex: 1; min-width: 0; display: grid; grid-template-columns: 38px minmax(0, 1fr) 18px; align-items: center; column-gap: 12px; padding: 10px 14px; min-height: 60px; color: inherit; text-decoration: none; transition: background .12s; }
.src-main:active { background: var(--raise-2); }
.src-main > svg { width: 18px; height: 18px; color: var(--ink-3); }
.tile { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 12px; font-weight: 700; letter-spacing: -.02em; background: var(--raise-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.tile.g { background: #fff; box-shadow: none; }
.tile.g .logo { width: 20px; height: 20px; }
.tile.mine { background: var(--sun-soft); color: var(--sun); box-shadow: none; }
.src-name { display: block; font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-sub { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-x { width: 44px; height: 44px; flex: none; display: grid; place-items: center; color: var(--ink-3); margin-right: 4px; }
.src-x svg { width: 18px; height: 18px; }
/* Show diary: researched shows for a sector, each with its date mark, its links and a plus to add it */
.dy-key { display: flex; flex-wrap: wrap; gap: 0 14px; margin: 10px 0 0; }
.dy-st { --stc: var(--ink-3); display: inline-flex; align-items: center; gap: 5px; min-height: 32px; min-width: 0; font-size: 13px; font-weight: 500; color: var(--stc); text-decoration: none; }
@supports (color: color-mix(in srgb, red, blue)) {
  .dy-st { color: color-mix(in srgb, var(--stc) 62%, var(--ink)); }   /* the words a shade deeper than the mark, so they read on light themes */
}
.dy-st svg { width: 15px; height: 15px; flex: none; color: var(--stc); }
.dy-st.organiser { --stc: var(--st-ok); }
.dy-st.listing { --stc: var(--st-check); }
a.dy-st:active { opacity: .45; }
.dy { padding: 14px 0 4px; border-bottom: 1px solid var(--line); }
.dy p { margin: 0; }
.dy-type { font-size: 12.5px; font-weight: 500; color: var(--ink-3); letter-spacing: .01em; }
.dy .dy-name { margin-top: 1px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.dy-name span { font-weight: 400; color: var(--ink-2); }
.dy .dy-when { margin-top: 3px; font-size: 14px; }
.dy-when b { color: var(--sun); font-weight: 600; }
.dy-venue { font-size: 14px; color: var(--ink-2); }
.dy .dy-who { margin-top: 6px; font-size: 13.5px; color: var(--ink-2); max-width: 32em; }
.dy .dy-note { margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--line-2); font-size: 13px; color: var(--ink-3); }
.dy-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.dy-ico { display: flex; flex: none; margin-right: -10px; }
.ico-btn.ok { color: var(--st-ok); }
/* Attendance: one line on a diary show or an exhibition, and the popup with every figure */
.att-line { width: 100%; display: grid; grid-template-columns: 20px minmax(0, 1fr) 16px; align-items: center; column-gap: 8px; margin: 6px 0 0; padding: 7px 0; text-align: left; color: var(--ink-2); min-height: 40px; }
.att-line > svg:first-child { width: 20px; height: 20px; }
.att-line > svg:last-child { width: 16px; height: 16px; color: var(--ink-3); }
.att-line:active { opacity: .55; }
.att-t { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 14px; min-width: 0; }
.att-n { color: var(--ink); font-weight: 500; }
.att-next { color: var(--ink-2); }
.att-m { --stc: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 500; color: var(--stc); }
@supports (color: color-mix(in srgb, red, blue)) { .att-m { color: color-mix(in srgb, var(--stc) 62%, var(--ink)); } }
.att-m svg { width: 14px; height: 14px; flex: none; color: var(--stc); }
.att-m.counted { --stc: var(--st-ok); }
.att-m.claim { --stc: var(--st-check); }
.att-m.estimate { --stc: var(--sun); }
.hero .att-line { margin-top: 12px; }
.att-show { margin: 0 0 4px; color: var(--ink-2); font-size: 14px; }
.att-est { padding: 12px 14px; border-radius: 14px; background: var(--raise-2); }
.att-est b { font-size: 17px; }
.att-est p { margin: 6px 0 0; font-size: 13.5px; color: var(--ink-2); }
.att-list { list-style: none; margin: 0; padding: 0; }
.att-f { padding: 10px 0; border-top: 1px solid var(--line); }
.att-f:first-child { border-top: 0; padding-top: 2px; }
.att-fh { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 14px; }
.att-words { color: var(--ink-3); font-size: 13px; }
.att-q { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); }
.att-src { display: inline-flex; align-items: center; gap: 2px; margin-top: 4px; font-size: 13px; font-weight: 500; color: var(--sun); text-decoration: none; min-height: 32px; }
.att-src svg { width: 15px; height: 15px; }
.att-note { margin: 14px 0 0; font-size: 13.5px; color: var(--ink-2); }
.att-none { margin: 0; }
.att-key { display: grid; gap: 6px; margin: 16px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); }
.att-key div { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: start; }
/* The organiser: who sells the stands, read from the show's own site */
.org { margin: 12px 0 0; padding: 12px 14px; border-radius: 16px; background: var(--raise); border: 1px solid var(--line); }
.org p { margin: 0; }
.org-h { font-size: 13.5px; color: var(--ink-2); }
.org-h b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.org-who { margin-top: 2px !important; font-size: 14px; }
.org-links { display: flex; flex-wrap: wrap; gap: 0 16px; margin-top: 4px; }
.org-l, .org-src { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; font-size: 14px; text-decoration: none; min-width: 0; }
.org-l { color: var(--sun); font-weight: 500; }
.org-l span { overflow-wrap: anywhere; }
.org-l svg { width: 18px; height: 18px; flex: none; }
.org-src { color: var(--ink-3); font-size: 13px; }
.org-src svg { width: 15px; height: 15px; }
.look-org { display: flex; gap: 6px; align-items: flex-start; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); }
.look-org svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
/* reading a show's own website in Add exhibition */
.look { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; font-size: 13.5px; line-height: 1.4; color: var(--ink-2); background: var(--raise-2); }
.look.ok { color: var(--ink); background: color-mix(in srgb, var(--st-ok) 14%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--st-ok) 40%, transparent); }
.look.ok b { color: var(--st-ok); }
.look.warn { color: var(--ink); background: color-mix(in srgb, var(--st-check) 14%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--st-check) 40%, transparent); }
.look small { display: block; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.look .link-btn { margin-top: 6px; }
.from { font-size: 11.5px; font-weight: 600; color: var(--st-ok); margin-left: 6px; }
.from[hidden] { display: none; }
.venue { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
.item, .ex { border-bottom: 1px solid var(--line); }
.item-main, .ex-main { width: 100%; display: grid; align-items: center; text-align: left; min-width: 0; }
.item-main { grid-template-columns: minmax(0, 1fr) 18px; column-gap: 12px; padding: 14px 0; min-height: 56px; }
.ex-main { grid-template-columns: 12px 1fr 18px; column-gap: 12px; padding: 12px 0; min-height: 60px; }
.item-main > svg, .ex-main > svg { width: 18px; height: 18px; color: var(--ink-3); }
.item-name, .ex-name { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-name.long { overflow: visible; text-overflow: clip; white-space: normal; overflow-wrap: anywhere; line-height: 1.3; }
.item-main > span { min-width: 0; }
.item-sub, .ex-sub { display: block; font-size: 13.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex-sub.dim { color: var(--ink-3); }
.ex-t { min-width: 0; }
.dot { width: 12px; height: 12px; border-radius: 3px; }
.dot.corporate { background: var(--st-ok); }
.dot.check { background: var(--st-check); }
.dot.consent { background: var(--st-consent); }
.dot.pending { border: 1.5px solid var(--ink-3); }
.more-btn { display: block; width: 100%; padding: 14px 0; text-align: left; font-size: 14px; font-weight: 500; color: var(--ink-2); border-bottom: 1px solid var(--line); }
.empty-list { margin: 18px 0 0; color: var(--ink-2); }
.foot { margin-top: 36px; font-size: 12.5px; color: var(--ink-3); }

/* Sheets */
dialog.sheet {
  position: fixed; inset: auto 0 0 0; margin: 0 auto; width: 100%; max-width: 34rem; max-height: 90vh;
  border: 0; border-radius: 22px 22px 0 0; padding: 0; background: var(--raise); color: var(--ink);
  overflow: auto; overscroll-behavior: contain;
}
dialog.sheet[open] { animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
/* Swipe right: the screen follows your finger and a back arrow appears at the left */
.swipe-back { position: fixed; left: 12px; top: 50%; width: 40px; height: 40px; margin-top: -20px; border-radius: 50%; background: var(--raise-2); color: var(--ink);
  display: grid; place-items: center; opacity: 0; pointer-events: none; z-index: 20; box-shadow: 0 4px 16px rgba(0, 0, 0, .25); }
.swipe-back svg { width: 22px; height: 22px; }
.swipe-back.ready { background: var(--ink); color: var(--bg); }
dialog.sheet::backdrop { background: var(--scrim, rgba(0, 0, 0, .55)); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet-in { padding: 10px 22px calc(28px + env(safe-area-inset-bottom)); }
.grabber { width: 36px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 0 auto 10px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-head h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
.sheet h3 { margin: 26px 0 6px; font-size: 15px; font-weight: 600; }
.sheet p { margin: 6px 0; color: var(--ink-2); font-size: 15px; }
.sheet p.hint, .sheet .hint { margin: 6px 0 0; font-size: 13.5px; color: var(--ink-3); }
.sheet .small, .small { font-size: 13.5px; color: var(--ink-3); }
.sheet .chips { margin-top: 10px; }
.kv { padding: 10px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.kv .k { display: block; font-size: 13px; color: var(--ink-3); }
.kv .v { display: block; font-size: 16px; color: var(--ink); overflow-wrap: anywhere; user-select: text; }
.kv .v a { text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.kv .s { display: block; font-size: 13px; color: var(--ink-3); margin-top: 1px; }
.menu { margin: 14px 0 0; }
.menu button { display: block; width: 100%; text-align: left; padding: 15px 0; min-height: 52px; border-bottom: 1px solid var(--line); font-weight: 500; font-size: 16px; }
.menu button small { display: block; font-weight: 400; font-size: 13.5px; color: var(--ink-3); margin-top: 1px; }
.menu button:last-child { border-bottom: 0; }
.tag { display: inline-block; padding: 3px 10px; border-radius: 12px; background: var(--raise-2); font-size: 13px; font-weight: 500; color: var(--ink-2); margin: 10px 8px 0 0; }
.tag.corporate { background: var(--sun); color: var(--on-sun); }
/* How many exhibitions a business is in, copying the company number, and the Companies House picker */
.ex-main.has-badge { grid-template-columns: 12px 1fr auto 18px; }
.ex-badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px 0 7px; border-radius: 12px; background: var(--raise-2); color: var(--ink-2); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 6px; }
.ex-badge svg { width: 14px; height: 14px; }
.leads .pct { color: var(--ink-3); font-size: .86em; margin-left: 2px; font-variant-numeric: tabular-nums; }
.v-copy { display: flex; align-items: center; gap: 2px; }
.copy-btn { width: 40px; height: 40px; margin: -8px 0 -8px 2px; display: grid; place-items: center; color: var(--ink-2); border-radius: 50%; flex: none; }
.copy-btn:active { background: var(--raise-2); }
.copy-btn svg { width: 19px; height: 19px; }
.copy-btn.done { color: var(--st-ok); }
.kv .s + .v { margin-top: 8px; }
.menu.picks button { padding: 12px 0; }
.menu.picks button.off { opacity: .75; }
.ex-note { font-size: 13.5px; color: var(--ink-3); margin: 4px 0 0; }
/* Notification setup steps */
.steps { list-style: none; counter-reset: st; margin: 14px 0 0; padding: 0; }
.steps li { counter-increment: st; position: relative; padding: 12px 0 14px 40px; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--ink-2); }
.steps li:last-child { border-bottom: 0; }
.steps li::before { content: counter(st); position: absolute; left: 0; top: 12px; width: 26px; height: 26px; border-radius: 50%; background: var(--raise-2); color: var(--ink); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.steps li strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }
.steps .btn { margin-top: 8px; }
.code { display: block; margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--bg); color: var(--ink); font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; user-select: text; }
.code { display: inline-block; margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 14px; word-break: break-all; user-select: all; }
.status-box { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--bg); font-size: 14px; color: var(--ink-2); }
.status-box p { margin: 2px 0; font-size: 14px; }

/* Find shows */
.find { margin: 4px 0 4px; padding: 14px; border-radius: 18px; background: var(--raise); border: 1px solid var(--line); animation: drop .18s ease-out; }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
.combo { position: relative; flex: 1; min-width: 0; }
.combo .field { padding-right: 46px; }
.combo-btn { position: absolute; right: 0; top: 0; width: 46px; height: 44px; display: grid; place-items: center; color: var(--ink-2); border-radius: 12px; }
.combo-btn svg { width: 20px; height: 20px; transition: transform .18s; }
.combo-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.find-list { margin-top: 10px; max-height: min(46vh, 380px); overflow-y: auto; overscroll-behavior: contain; border-radius: 12px; background: var(--bg); }
.opt { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; padding: 0 14px; text-align: left; font-size: 15.5px; color: var(--ink); border-bottom: 1px solid var(--line); }
.opt:last-child { border-bottom: 0; }
.opt:active { background: var(--raise-2); }
.opt .n { flex: none; min-width: 1.5ch; text-align: right; font-size: 14px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.opt.has .n { color: var(--sun); font-weight: 600; }
.opt-note { margin: 0; padding: 14px; font-size: 14px; color: var(--ink-3); }
#searchBtn .i-close, #searchBtn[aria-expanded="true"] .i-open { display: none; }
#searchBtn[aria-expanded="true"] .i-close { display: block; }
#searchBtn[aria-expanded="true"] { color: var(--sun); }
.leads { list-style: none; margin: 14px 0 0; padding: 0; max-width: 30em; font-size: 17px; font-weight: var(--thin); line-height: 1.4; color: var(--ink); }
.leads li { padding: 6px 0; display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: 10px; align-items: start; }
.leads .lk { width: 12px; height: 12px; border-radius: 3px; margin-top: 6px; justify-self: center; }
.leads .lk.google, .leads .lk.microsoft { width: 16px; height: 16px; margin-top: 4px; border-radius: 0; }
.leads .lk .logo { display: block; }
.leads .lk.other { background: var(--prov-o); box-shadow: inset 0 0 0 1px var(--line-2); }
/* The top line: a tick when all are checked; while leads wait, a spinner (or a still ring when paused), how many, and play or pause */
.leads li.head { grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; }
.leads .lk.mark { width: 18px; height: 18px; margin-top: 0; background: none; display: grid; place-items: center; }
.tick { width: 18px; height: 18px; display: block; }
.tick circle { fill: var(--raise-2); }
.tick path { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.lk.mark .spinner { margin: 0; width: 14px; height: 14px; color: var(--ink-2); }
.lk.mark .ring { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink-3); }
.leads .head .sub { display: block; font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.run-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); background: var(--raise-2); margin-left: 8px; flex: none; }
.run-btn.go { background: var(--sun); color: var(--on-sun); }
.run-btn svg { width: 22px; height: 22px; fill: currentColor; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.leads .lk.corporate { background: var(--st-ok); }
.leads .lk.check { background: var(--st-check); }
.leads .lk.consent { background: var(--st-consent); }
.leads strong { font-weight: 600; }

/* How matches were made, speed and rechecks, in Settings */
.ev { display: grid; gap: 8px; margin-top: 10px; }
.ev-row { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; font-size: 14px; color: var(--ink-2); }
.ev-row b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.sp-row { margin-top: 10px; }
.why { margin: 10px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--bg); color: var(--ink-2); font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
.why-cmp { display: grid; gap: 4px; margin-top: 10px; font-size: 14px; color: var(--ink-2); }
.why-cmp b { color: var(--ink); font-weight: 600; }
.sp-row .use-row { margin-bottom: 4px; }
.rc-grid { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px 14px; align-items: center; margin-top: 10px; font-size: 14px; color: var(--ink-2); }
.rc-grid b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }
.rc-grid .arrow { color: var(--ink-3); }
.rc-grid .lab { display: flex; gap: 10px; align-items: center; }
.rc-grid .head { font-size: 12.5px; color: var(--ink-3); text-align: right; }
/* Colour theme and usage, both in Settings */
.use { margin-top: 12px; }
.use-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; font-size: 14px; color: var(--ink-2); }
.use-row b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 4px; margin-top: 8px; }
.theme-opt { display: grid; justify-items: center; gap: 6px; padding: 4px 0; font-size: 12.5px; color: var(--ink-2); }
.theme-opt[aria-pressed="true"] { color: var(--ink); }
.sw { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-2);
  background: radial-gradient(circle, var(--b) 0 6px, transparent 7px), radial-gradient(circle at 50% 35%, var(--c), var(--a)); }
.theme-opt[aria-pressed="true"] .sw { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--sun); }

/* Toast. It is a popover, which the browser draws in its top layer, so it shows above an open sheet (a sheet is a modal dialog
   and covers any ordinary element, whatever its z-index). The resets below undo the browser's own popover box. */
.toast { position: fixed; inset: auto auto calc(24px + env(safe-area-inset-bottom)) 50%; margin: 0; border: 0; width: max-content; height: auto; overflow: visible; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 22px; font-size: 14px; font-weight: 500; transition: opacity .2s, transform .2s; max-width: calc(100% - 40px); text-align: center; z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.notify-result { margin: 12px 0 0; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.notify-result:empty { display: none; }
.notify-result.bad { color: var(--st-consent); font-weight: 500; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  /* a spinner is how you know something is happening: it keeps turning, slowly, when the phone asks for less motion */
  .spinner, .btn.busy::after, .menu button.busy::after, .chip.busy::after { animation: spin 1.6s linear infinite !important; }
}

/* ---------- Showsum HQ (release 7): HQ's colours and type, and the pipeline's side of each show ---------- */
:root[data-theme="hq"] {
  --sans: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg: #0e0f13; --raise: #16181e; --raise-2: #22252d;
  --line: rgba(169, 173, 184, 0.12); --line-2: rgba(169, 173, 184, 0.22);
  --ink: #f3f1ea; --ink-2: #a9adb8; --ink-3: #8a8f9c;
  --sun: #ffd23f; --sun-soft: rgba(255, 210, 63, 0.14); --on-sun: #1d1904;
  --st-ok: #7ee0a1; --st-check: #fcc35d; --st-consent: #ff7a66;
  --on-ok: #0e0f13; --on-check: #0e0f13; --on-consent: #0e0f13;
  --scrim: rgba(0, 0, 0, .62); --thin: 400; --status: #0e0f13;
  color-scheme: dark;
}
.wrap { max-width: 40rem; }
.hq-mark { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
.hq-dots { display: grid; grid-template-columns: repeat(2, 7px); gap: 3px; flex: none; }
.hq-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--sun); }
.hq-back { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .12em; color: var(--ink-3); text-decoration: none; text-transform: uppercase; }
.hq-back:hover { color: var(--sun); }
.pipe { margin: 18px 0 4px; padding: 14px 16px; border-radius: 16px; background: var(--raise); border: 1px solid var(--line); }
.pipe-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.pipe-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
.pipe-h .eyebrow { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: .14em; color: var(--ink-3); text-transform: uppercase; }
.pipe p { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
.pipe .actions { margin-top: 12px; }
.pipe .bl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pipe .bl a, .pipe .bl span { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .06em; padding: 4px 8px; border-radius: 6px; background: var(--raise-2); color: var(--ink-2); text-decoration: none; }
.pchip { display: inline-block; margin-left: 6px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; letter-spacing: .06em; padding: 2px 6px; border-radius: 5px; background: var(--raise-2); color: var(--ink-2); vertical-align: 2px; }
.pchip.check { color: var(--st-check); }
.pchip.batch { color: var(--sun); }
.go-sum { margin: 10px 0 0; padding: 0; list-style: none; }

<div class="swipe-back" id="swipeBack" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>
<div class="top" id="top"><div class="top-in">
  <header>
    <div class="brand">
      <button class="icon-btn back" id="back" type="button" data-act="back" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div>
        <a class="hq-back" href="../#/overview">Showsum HQ</a>
        <div class="mark">Exhibitors</div>
        <span class="where" id="where"></span>
      </div>
    </div>
    <div class="tools">
      <button class="icon-btn" id="searchBtn" type="button" aria-expanded="false" aria-controls="findPanel" aria-label="Find shows" hidden>
        <svg class="i-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
        <svg class="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>
  <div class="find" id="findPanel" hidden>
    <form id="findForm" role="search" novalidate>
      <label class="lbl" for="findIn" style="margin-top:0">Find shows for a sector</label>
      <div class="field-row" style="margin-top:0">
        <div class="combo">
          <input class="field" id="findIn" placeholder="Type a sector" autocomplete="off" autocapitalize="sentences" enterkeyhint="go" maxlength="40" role="combobox" aria-expanded="false" aria-controls="findList">
          <button class="combo-btn" id="findArrow" type="button" aria-expanded="false" aria-controls="findList" aria-label="Show all sectors">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>
        <button class="btn primary" type="submit">Find shows</button>
      </div>
    </form>
    <div class="find-list" id="findList" role="listbox" aria-label="Sectors" hidden></div>

</div></div>

  <main id="main" aria-live="polite"></main>
